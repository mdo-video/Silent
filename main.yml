name: Build APK e EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.n.outputs.build }}
    steps:
      - id: n
        run: echo "build=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"

  android:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai progetto
        run: unzip -oq Silent.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Compila APK
        run: gradle assembleDebug --no-daemon -PbuildNumber=${{ needs.prep.outputs.build }}
      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Silent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Silent-APK
          path: Silent.apk

  windows:
    needs: prep
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai progetto
        shell: pwsh
        run: Expand-Archive -Path Silent.zip -DestinationPath . -Force
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa librerie
        run: pip install pyinstaller numpy pyaudiowpatch
      - name: Numero di build
        shell: bash
        run: echo "BUILD = ${{ needs.prep.outputs.build }}" > pc/build_info.py
      - name: Compila EXE
        shell: bash
        run: |
          cd pc
          pyinstaller --onefile --windowed --name Silent-PC --icon silent.ico --add-data "silent.ico;." --collect-all pyaudiowpatch Silent.py
      - uses: actions/upload-artifact@v4
        with:
          name: Silent-PC-EXE
          path: pc/dist/Silent-PC.exe

  release:
    needs: [prep, android, windows]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Silent-APK
          path: out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Silent-PC-EXE
          path: out
      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(out/Silent.apk)
          if [ -f out/Silent-PC.exe ]; then files+=(out/Silent-PC.exe); fi
          gh release create "b${{ needs.prep.outputs.build }}" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Silent build ${{ needs.prep.outputs.build }}" \
            --notes "Compilazione automatica numero ${{ needs.prep.outputs.build }}"
